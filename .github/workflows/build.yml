name: Windows build
on:
  push:
  pull_request:
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and test (no audio hardware on hosted runner)
        shell: powershell
        run: .\build.ps1 -Test -NoAudio
      - uses: actions/upload-artifact@v4
        with:
          name: Pulse-Windows-x64
          path: bin/Pulse.exe
