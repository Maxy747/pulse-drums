<style>

.piece{--energy:0;--rim:hsl(var(--hue) 40% 30%)}.surface{fill:url(#skin);stroke:var(--rim);stroke-width:2.6}.inner{fill:none;stroke:hsl(var(--hue) 44% 25%);stroke-width:1}.groove{stroke:var(--rim);stroke-width:.7;fill:none;opacity:.5}.hardware{fill:hsl(var(--hue) 38% 12%);stroke:var(--rim);stroke-width:1.8}.lit{opacity:var(--energy);pointer-events:none}.halo{fill:none;stroke:var(--accent);stroke-width:5;filter:url(#glow)}.flash{fill:hsl(var(--hue) 64% 27%);stroke:hsl(var(--hue) 95% 84%);stroke-width:3}.label-bg{fill:#09110c;fill-opacity:.85}.piece text{fill:#d5e8d9;text-anchor:middle;font-family:inherit;pointer-events:none}.number{font-size:17px;fill:var(--accent)!important}.name{font-size:16px}.labels-off .name{display:none}.labels-off .label-bg{opacity:0}.labels-off .number{font-size:22px}.seat{fill:#455e4b;font-size:10px;letter-spacing:3px;text-anchor:middle}

@media(prefers-reduced-motion:reduce){.velocity span{transition:none}}
body{min-height:100vh;min-height:100dvh;-webkit-text-size-adjust:100%}button{touch-action:manipulation;-webkit-tap-highlight-color:transparent}.shell{min-height:100vh;min-height:100dvh;padding-top:max(18px,env(safe-area-inset-top));padding-left:max(16px,env(safe-area-inset-left));padding-right:max(16px,env(safe-area-inset-right));padding-bottom:max(14px,env(safe-area-inset-bottom))}
@media(pointer:coarse){.toolbar button{min-width:44px;min-height:44px}.dot{padding:12px}.themes{display:flex}.toolbar{gap:4px}.toolbar button:not(.dot){padding:10px}.stage{touch-action:pan-y}}

#masterDial{display:flex;align-items:center;gap:7px;touch-action:none;user-select:none;cursor:ns-resize;min-width:105px}#dialMark{font-size:26px;color:var(--accent)}#dialValue{font-variant-numeric:tabular-nums}.toolbar{flex-wrap:wrap;justify-content:flex-end}.touch-mode #kit{touch-action:none;user-select:none;-webkit-user-select:none}.touch-mode .piece,.edit-mode .piece{cursor:pointer}.edit-mode .piece:hover .surface{stroke:var(--accent)}.drawer{position:fixed;right:0;top:0;bottom:0;z-index:20;width:min(440px,100%);background:#111914;border-left:1px solid var(--line);padding:max(18px,env(safe-area-inset-top)) 20px max(20px,env(safe-area-inset-bottom));overflow:auto;box-shadow:-20px 0 65px #0008}.drawer[hidden]{display:none}.drawer-head{display:flex;justify-content:space-between;align-items:center;gap:12px}.drawer h2{font-size:23px;margin:10px 0}.drawer button,.drawer select,.drawer input:not([type=checkbox]){min-height:44px}.drawer select,.drawer input[type=text]{color:#e7eee8;background:#1e2a21;border:1px solid #3b4a3d;border-radius:7px;padding:10px;width:100%;font:inherit}.drawer details{border-bottom:1px solid #2c3c30;padding:14px 0}.drawer summary{font-size:17px;cursor:pointer;min-height:38px}.field{display:block;margin:15px 0}.field>span{display:block;margin-bottom:7px;color:#c5d2c7;font-size:13px}.field input[type=range]{width:100%;accent-color:var(--accent)}.field input[type=checkbox]{width:22px;height:22px;vertical-align:middle;margin-right:12px;accent-color:var(--accent)}.field output{float:right;color:var(--accent)}.field button{width:100%;text-align:left}.drawer small{overflow-wrap:anywhere;display:block;color:#829187;font-size:11px;margin-top:5px}.drawer p{font-size:13px;color:#adbbb0;line-height:1.5}.drawer :disabled{opacity:.45}#remoteMessage{position:fixed;bottom:max(12px,env(safe-area-inset-bottom));left:12px;z-index:30;background:#243128;border:1px solid var(--accent);border-radius:8px;padding:12px;max-width:90%;font-size:13px}#remoteMessage:empty{d </style>
</head>
<body class="offline">
<div class="shell">
<header>
 <div class="brand"><svg class="logo" viewBox="0 0 64 68" aria-hidden="true"><circle cx="32" cy="27" r="22" fill="none" stroke="currentColor" stroke-width="3"/><circle cx="32" cy="27" r="17" fill="none" stroke="currentColor"/><path d="M16 44 10 57M48 44 54 57M32 30v26" stroke="currentColor" stroke-width="3"/><rect x="27" y="49" width="10" height="13" rx="2" fill="currentColor"/></svg><span class="wordmark">pulse</span><span class="tag">Live kit</span></div>
 <div id="status" class="status" role="status"><i></i><span id="statusText">Connecting to Pulse</span></div>
 <div class="toolbar"><div class="themes"><button class="dot" data-theme="Green" style="--swatch:#b7f76c" aria-label="Green theme" aria-pressed="false"><span></span></button><button class="dot" data-theme="Red" style="--swatch:#f77885" aria-label="Red theme" aria-pressed="false"><span></span></button><button class="dot" data-theme="Blue" style="--swatch:#70bbff" aria-label="Blue theme" aria-pressed="false"><span></span></button></div><button id="sync" title="Follow the desktop app's theme">Sync</button><button id="labels" aria-pressed="true">Labels</button><button id="focus" aria-pressed="false">Focus</button><button id="masterDial" role="slider" aria-label="Master gain in decibels" aria-valuemin="-60" aria-valuemax="60" aria-valuenow="0" title="Drag vertically or scroll. Double-click resets to 0 dB."><span id="dialMark">◉</span><span id="dialValue">Gain</span></button><button id="touch" aria-pressed="false">Touch play</button><button id="edit" aria-pressed="false">Edit</button><button id="settings">Settings</button><button id="fullscreen" aria-label="Fullscreen" title="Fullscreen">⛶</button></div>
</header>
<main class="stage" aria-label="Live drum kit feedback">
 <div class="stage-top"><span id="viewLabel">Your kit · player perspective</span><strong id="stageStatus">Waiting for Pulse</strong></div>
 <svg id="kit" viewBox="0 0 1000 650" role="img" aria-label="Eight-piece kit: hi-hat, crash, low tom, snare, mid tom, kick, floor tom and ride">
  <defs><radialGradient id="skin" cx="35%" cy="28%" r="80%"><stop offset="0" stop-color="hsl(var(--hue) 45% 16%)"/><stop offset="1" stop-color="hsl(var(--hue) 40% 6%)"/></radialGradient><filter id="glow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="7"/></filter></defs>
  <g transform="translate(0 23)"><path class="stand" d="M195 264 139 335 322 501 354 546M771 439 698 527M113 565 102 594"/><g id="pieces"></g><text class="seat" x="505" y="615">PLAYER POSITION</text></g>
 </svg>
</main>
<section class="stats" aria-label="Live session details">
 <div class="stat"><div class="caption" id="lastCaption">Last hit</div><div class="value" id="last">Ready to play</div></div>
 <div class="stat"><div class="caption">Velocity</div><div class="value"><span id="velocity">—</span> <small>/ 127</small></div><div class="velocity"><span id="velocityBar"></span></div></div>
 <div class="stat"><div class="caption">Session hits</div><div class="value" id="count">0</div></div>
 <div class="stat"><div class="caption">Hi-hat pedal</div><div class="value" id="hatState">Not connected</div><div class="pedals"><span>HH</span><meter id="hatMeter" min="0" max="1" value="0" aria-label="Hi-hat pedal position"></meter><span>Kick</span><meter id="kickMeter" min="0" max="1" value="0" aria-label="Kick pedal position"></meter></div></div>
</section>
<footer><span id="connectionDetail">Keep Pulse running · reconnects automatically</span><span>Live kit · audio plays on the PC</span></footer>
</div>
<aside id="settingsDrawer" class="drawer" hidden aria-label="Pulse settings"><div class="drawer-head"><h2 id="drawerTitle">Pulse settings</h2><button id="closeSettings" aria-label="Close settings">Close</button></div><p id="remoteStatus"></p><div id="remoteFields"></div></aside><div id="remoteMessage" role="status"></div>
<script>
(()=>{'use strict';
const names=['Hi-hat','Crash','Low tom','Snare','Mid tom','Bass / Kick','Floor tom','Ride'];
const centers=[[125,465],[210,155],[410,195],[350,370],[590,195],[505,373],[665,387],[835,350]],radii=[110,126,80,72,80,94,85,139],order=[5,2,4,3,6,1,0,7];
const $=id=>document.getElementById(id),ns='http://www.w3.org/2000/svg';
function el(tag,attrs,parent){const n=document.createElementNS(ns,tag);for(const [k,v] of Object.entries(attrs))n.setAttribute(k,v);parent.append(n);return n;}
const nodes=[],energies=Array(8).fill(0),struck=Array(8).fill(-1e9),seq=Array(8).fill(0);let session='',lastMessage=0,source=null,themeOverride=null,appTheme='Green',lastFrame=0;
function storage(key,value){try{if(value===undefined)return localStorage.getItem(key);localStorage.setItem(key,value);}catch{}return null;}
themeOverride=storage('pulseViewTheme')||null;
for(const i of order){const [x,y]=centers[i],r=radii[i],ry=r*.91,cymbal=[0,1,7].includes(i);const g=el('g',{class:'piece','data-part':i,transform:`translate(${x} ${y})`},$('pieces'));nodes[i]=g;el('title',{},g).textContent=names[i];
 if(!cymbal){el('ellipse',{class:'hardware',cx:0,cy:15,rx:r,ry},g);for(let l=0;l<8;l++){let a=(l+.5)*Math.PI/4;el('rect',{class:'hardware',x:Math.cos(a)*r-5,y:Math.sin(a)*ry-5,width:10,height:19,rx:2},g);}}
 el('ellipse',{class:'surface',rx:r,ry},g);const light=el('g',{class:'lit'},g);el('ellipse',{class:'halo',rx:r+3,ry:ry+3},light);el('ellipse',{class:'flash',rx:r,ry},light);
 el('ellipse',{class:'inner',rx:r-8,ry:ry-8},g);
 if(cymbal){for(let k=18;k<r-9;k+=5)el('ellipse',{class:'groove',rx:k,ry:k*.91},g);el('ellipse',{class:'hardware',rx:16,ry:14},g);el('path',{d:'M0 0 49 -45',class:'groove','stroke-width':4},g);}
 if(i===5){el('path',{class:'groove',d:'M0 71V158','stroke-width':4},g);for(let p=0;p<2;p++)el('rect',{class:'hardware',x:-44+p*49,y:94,width:40,height:70,rx:5},g);el('rect',{class:'hardware',x:-8,y:51,width:16,height:23,rx:3},g);}
 let ly=cymbal?29:-18;el('rect',{class:'label-bg',x:-63,y:ly-3,width:126,height:52,rx:7},g);el('text',{class:'number',x:0,y:ly+17},g).textContent=i+1;el('text',{class:'name',x:0,y:ly+39},g).textContent=names[i];
}
function setTheme(name){let chosen=themeOverride||name;document.documentElement.style.setProperty('--hue',{Green:112,Red:352,Blue:207}[chosen]||112);document.querySelectorAll('[data-theme]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.theme===chosen)));$('sync').setAttribute('aria-pressed',String(!themeOverride));}
document.querySelectorAll('[data-theme]').forEach(b=>b.onclick=()=>{themeOverride=b.dataset.theme;storage('pulseViewTheme',themeOverride);setTheme(appTheme);});$('sync').onclick=()=>{themeOverride=null;storage('pulseViewTheme','');setTheme(appTheme);};setTheme('Green');
function toggle(id,cls,inverted=false){const enabled=document.body.classList.toggle(cls);$(id).setAttribute('aria-pressed',String(inverted?!enabled:enabled));}
$('labels').onclick=()=>toggle('labels','labels-off',true);$('focus').onclick=()=>toggle('focus','focus');
$('fullscreen').onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else if(document.documentElement.requestFullscreen)await document.documentElement.requestFullscreen();else throw new Error();}catch{document.body.classList.add('focus');$('focus').setAttribute('aria-pressed','true');alert('For a full-screen view on iPad: Safari → Share → Add to Home Screen, then open Pulse from your Home Screen.');}};
function render(data){const now=performance.now();lastMessage=now;if(typeof data.gain==='number'&&dialY===null)showGain(data.gain);document.body.classList.remove('offline');$('status').classList.add('live');$('statusText').textContent=demo?'Demo · simulated hits':'Pulse connected';$('stageStatus').textContent=data.learning?'Kit setup':data.ready?'Live feedback':'Waiting for drum input';$('connectionDetail').textContent=data.status;
 if(data.session!==session){session=data.session;seq.fill(0);struck.fill(-1e9);energies.fill(0);}
 data.pads.forEach((pad,i)=>{if(pad[0]!==seq[i]){seq[i]=pad[0];if(pad[2]>=0&&pad[2]<700){struck[i]=now-pad[2];energies[i]=.55+.45*pad[1]/127;}}});
 $('count').textContent=data.total.toLocaleString();$('last').textContent=data.last<0?'Ready to play':names[data.last];$('lastCaption').textContent=data.preview?'App preview':'Last hit';const v=data.last<0?null:data.pads[data.last][1];$('velocity').textContent=v===null?'—':v;$('velocityBar').style.width=(v||0)/127*100+'%';
 $('hatState').textContent=data.pedals?(data.closed?'Closed':'Open'):'Not connected';$('hatMeter').value=data.pedals?data.hat:0;$('kickMeter').value=data.pedals?data.kick:0;appTheme=data.theme;setTheme(appTheme);
}
function offline(){document.body.classList.add('offline');$('status').classList.remove('live');$('statusText').textContent='Reconnecting to Pulse';$('stageStatus').textContent='Feed offline';$('connectionDetail').textContent='Open Pulse on this PC · this view reconnects automatically';}
function animate(now){if(!document.hidden&&now-lastFrame>15){lastFrame=now;for(let i=0;i<8;i++){let value=energies[i]*Math.exp(-(now-struck[i])/150);if(value<.008)value=0;if(value||nodes[i].style.getPropertyValue('--energy')!=='0')nodes[i].style.setProperty('--energy',value.toFixed(3));}}requestAnimationFrame(animate);}requestAnimationFrame(animate);
let touchEnabled=false,editEnabled=false,remotePart=0,remoteMode='all',touchVelocity=100,commandQueue=Promise.resolve(),messageTimer;
const token='__PULSE_TOKEN__';
let masterDb=0,dialY=null,dialTimer;
function showGain(value){masterDb=Math.max(-60,Math.min(60,value));$('dialValue').textContent=(masterDb>0?'+':'')+masterDb.toFixed(2)+' dB';$('masterDial').setAttribute('aria-valuenow',masterDb.toFixed(2));$('dialMark').style.transform='rotate('+masterDb*3+'deg)';}
function sendGain(){if(!demo)command({action:'set',id:'OutputGainSlider',value:masterDb.toFixed(2)});}
$('masterDial').onpointerdown=e=>{dialY=e.clientY;$('masterDial').setPointerCapture(e.pointerId);e.preventDefault();};
$('masterDial').onpointermove=e=>{if(dialY===null)return;showGain(masterDb+(dialY-e.clientY)*(e.shiftKey?.01:.1));dialY=e.clientY;};
$('masterDial').onpointerup=e=>{if(dialY===null)return;dialY=null;sendGain();};$('masterDial').onpointercancel=()=>{dialY=null;sendGain();};
$('masterDial').ondblclick=()=>{showGain(0);sendGain();};
$('masterDial').addEventListener('wheel',e=>{e.preventDefault();showGain(masterDb-Math.sign(e.deltaY)*(e.shiftKey?.01:.5));clearTimeout(dialTimer);dialTimer=setTimeout(sendGain,100);},{passive:false});
$('masterDial').onkeydown=e=>{if(['ArrowUp','ArrowRight','ArrowDown','ArrowLeft'].includes(e.key)){e.preventDefault();showGain(masterDb+(['ArrowUp','ArrowRight'].includes(e.key)?1:-1)*(e.shiftKey?.01:.1));sendGain();}};

function message(text){$('remoteMessage').textContent=text;clearTimeout(messageTimer);messageTimer=setTimeout(()=>$('remoteMessage').textContent='',6000);}
async function requestControl(data){const r=await fetch('/control',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded','X-Pulse-Token':token},body:new URLSearchParams(data)});if(!r.ok)throw new Error('Pulse rejected the request ('+r.status+'). Reload this page.');const result=await r.json();if(result.error)throw new Error(result.error);return result;}
function command(data){commandQueue=commandQueue.catch(()=>{}).then(()=>requestControl(data)).then(data=>{if(data.groups&&!$('settingsDrawer').hidden)drawControls(data);return data;}).catch(e=>message(e.message));return commandQueue;}
function setEdit(value){editEnabled=value;document.body.classList.toggle('edit-mode',value);$('edit').setAttribute('aria-pressed',String(value));}
$('touch').onclick=()=>{if(demo){message('Touch playback needs the live Pulse connection.');return;}touchEnabled=!touchEnabled;document.body.classList.toggle('touch-mode',touchEnabled);$('touch').setAttribute('aria-pressed',String(touchEnabled));message(touchEnabled?'Touch play on · audio plays through the PC output':'Touch play off');};
$('edit').onclick=()=>{if(demo)return;setEdit(!editEnabled);if(editEnabled){remoteMode='pad';openSettings();message('Tap a drum to edit its sound and settings.');}else $('settingsDrawer').hidden=true;};
$('settings').onclick=()=>{setEdit(false);remoteMode='all';openSettings();};
$('closeSettings').onclick=()=>{$('settingsDrawer').hidden=true;setEdit(false);};
for(let i=0;i<8;i++){nodes[i].addEventListener('pointerdown',e=>{if(demo)return;if(editEnabled){e.preventDefault();remoteMode='pad';$('settingsDrawer').hidden=false;command({action:'select',part:i});}else if(touchEnabled){e.preventDefault();if(!lastMessage||performance.now()-lastMessage>2500){message('Pulse is offline. Keep the PC app running.');return;}requestControl({action:'hit',part:i,value:touchVelocity}).catch(e=>message(e.message));}});}
async function openSettings(){if(demo){message('Settings are available in the live view.');return;}$('settingsDrawer').hidden=false;$('remoteFields').textContent='Loading…';try{const r=await fetch('/controls');if(!r.ok)throw new Error('Cannot load Pulse settings');const data=await r.json();if(data.error)throw new Error(data.error);drawControls(data);}catch(e){$('remoteFields').textContent=e.message;}}
function htmlEl(tag,parent,text){const e=document.createElement(tag);if(text!==undefined)e.textContent=text;parent.append(e);return e;}
function drawControls(data){for(const group of data.groups)for(const c of group.controls)if(c.id==='OutputGainSlider'&&dialY===null)showGain(Number(c.value));remotePart=data.part;$('drawerTitle').textContent=remoteMode==='pad'?data.name+' · '+data.input:'Pulse settings';$('remoteStatus').textContent=remoteMode==='pad'?'Choose matching sounds below. Changes save on the PC.':data.audio;const host=$('remoteFields');host.replaceChildren();
 const choose=htmlEl('label',host);choose.className='field';htmlEl('span',choose,'Drum');const parts=htmlEl('select',choose);names.forEach((n,i)=>{const o=htmlEl('option',parts,(i+1)+' · '+n);o.value=i;});parts.value=data.part;parts.onchange=()=>command({action:'select',part:parts.value});
 if(remoteMode==='all'){const label=htmlEl('label',host);label.className='field';htmlEl('span',label,'Touch play velocity');const output=htmlEl('output',label,touchVelocity);const v=htmlEl('input',label);v.type='range';v.min=1;v.max=127;v.value=touchVelocity;v.oninput=()=>{touchVelocity=Number(v.value);output.textContent=v.value;};htmlEl('small',label,'Touch playback uses the PC audio output. Network latency is added.');}
 for(const group of data.groups){if(remoteMode==='pad'&&group.label!=='Pad')continue;const section=htmlEl('details',host);section.open=remoteMode==='pad'||group.label==='Output';htmlEl('summary',section,group.label);for(const c of group.controls){const label=htmlEl(c.type==='button'?'div':'label',section);label.className='field';let input;const change=value=>command({action:'set',id:c.id,value,part:remotePart});
 if(c.type==='button'){input=htmlEl('button',label,c.label);input.onclick=()=>{if(['AsioPanelButton','LibraryFolderButton','BrowseSampleButton'].includes(c.id))message('Complete the dialog on your PC.');change('');};}
 else{htmlEl('span',label,c.label);if(c.type==='select'){input=htmlEl('select',label);c.options.forEach((name,i)=>{const o=htmlEl('option',input,name);o.value=i;});input.value=c.value;input.onchange=()=>change(input.value);}
 else if(c.type==='checkbox'){input=htmlEl('input',label);input.type='checkbox';input.checked=c.value;input.onchange=()=>change(String(input.checked));}
 else{const output=htmlEl('output',label,Number(c.value).toFixed(c.step<1?2:0));input=htmlEl('input',label);input.type='range';input.min=c.min;input.max=c.max;input.step=c.step;input.value=c.value;input.oninput=()=>output.textContent=input.value;input.onchange=()=>change(input.value);}}
 input.disabled=!c.enabled;if(c.hint)htmlEl('small',label,c.hint);if(['AsioPanelButton','LibraryFolderButton','BrowseSampleButton'].includes(c.id))htmlEl('small',label,'Opens a native dialog on the PC.');}
 if(group.label==='Trigger protection & setup')htmlEl('p',section,data.setup);if(group.label==='Pedals'){htmlEl('p',section,data.pedals);htmlEl('p',section,data.calibration);}}
 if(remoteMode==='all'){const presets=htmlEl('details',host);htmlEl('summary',presets,'Save / load your presets');const select=htmlEl('select',presets);for(const name of data.presets)htmlEl('option',select,name);const load=htmlEl('button',presets,'Load selected preset');load.disabled=!data.presets.length;load.onclick=()=>command({action:'loadPreset',value:select.value});const name=htmlEl('input',presets);name.type='text';name.maxLength=64;name.placeholder='New preset name';name.setAttribute('aria-label','Preset name');const save=htmlEl('button',presets,'Save current settings');save.onclick=()=>{if(data.presets.includes(name.value)&&!confirm('Replace this saved preset?'))return;command({action:'savePreset',value:name.value});};const refresh=htmlEl('button',host,'Refresh settings / setup progress');refresh.onclick=openSettings;htmlEl('small',host,'Changes apply to the desktop app and save automatically. ASIO driver panels and file pickers open on the PC.');}
}
const demo=new URLSearchParams(location.search).get('demo')==='1';
function connect(){if(demo||document.hidden||source)return;source=new EventSource('/events');source.onmessage=e=>{try{render(JSON.parse(e.data));}catch{offline();}};source.onerror=offline;}
document.addEventListener('visibilitychange',()=>{if(document.hidden&&source){source.close();source=null;}else connect();});window.addEventListener('pagehide',()=>{if(source)source.close();source=null;});window.addEventListener('pageshow',connect);
if(!demo)fetch('/controls').then(r=>r.json()).then(data=>{if(data.groups)for(const group of data.groups)for(const c of group.controls)if(c.id==='OutputGainSlider')showGain(Number(c.value));}).catch(()=>{});
if(demo){$('viewLabel').textContent='Demo · simulated hits';$('viewLabel').classList.add('demo-notice');let t=0;const data={session:'demo',theme:'Green',status:'Visual demonstration — not live drum input',ready:true,pedals:true,closed:false,kick:0,hat:0,learning:false,total:0,last:-1,preview:false,pads:Array.from({length:8},()=>[0,0,-1])};setInterval(()=>{data.pads.forEach(p=>{if(p[2]>=0)p[2]+=450;});let i=[5,0,3,0,5,2,4,1,6,7][t++%10];data.last=i;data.total++;data.pads[i]=[data.pads[i][0]+1,95,0];data.closed=t%4<2;data.hat=data.closed?1:0;data.kick=i===5?1:0;render(data);},450);}else{connect();setInterval(()=>{if(lastMessage&&performance.now()-lastMessage>2500)offline();},500);}
})();
</script>
</body>
